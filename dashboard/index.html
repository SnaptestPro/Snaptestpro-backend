<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SnapTestPro Backend Dashboard</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2140;--mut:#6b7394;--line:#e3e7f2;--pri:#4f46e5;--pri2:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#10131f;--card:#181c2e;--tx:#e8ebff;--mut:#9aa3c7;--line:#2a3050;--pri:#818cf8;--pri2:#23284a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#login{max-width:380px;margin:12vh auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut)}.sm{font-size:13px}.mono{font-family:var(--mono);font-size:12.5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{font-family:var(--mono);font-size:12.5px;min-height:220px;resize:vertical}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.btn:active{transform:scale(.98)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px}.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:140px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:10px}
header b{font-size:16px}header .sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(49px + env(safe-area-inset-top,0px));z-index:19;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;padding:8px 13px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--mut);white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:22px}.stat span{font-size:12.5px;color:var(--mut)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}tr.click{cursor:pointer}tr.click:hover{background:var(--pri2)}
td.pv{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-family:var(--mono);font-size:12px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--pri2);color:var(--pri);font-size:12.5px;font-weight:600;margin:2px 4px 2px 0;cursor:pointer;border:0}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.tag.ok{background:#dcfce7;color:#166534}.tag.off{background:#fee2e2;color:#991b1b}.tag.ad{background:#fef3c7;color:#92400e}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px}.bars i{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars.w i{background:#f59e0b}
#ov{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#ov .box{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){#ov{align-items:center}#ov .box{border-radius:18px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2140;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.e{background:var(--bad)}
pre.code{background:#0f1226;color:#d6dcff;padding:12px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:12px;margin:6px 0;white-space:pre}
.warn{background:#fffbeb;border:1px solid #fcd34d;color:#78350f;padding:10px 12px;border-radius:10px;font-size:13.5px;margin:10px 0}
@media(prefers-color-scheme:dark){.warn{background:#3a2f10;color:#fde68a;border-color:#7c5e10}}
.err{color:var(--bad);font-size:13.5px;margin-top:8px}
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="card">
    <h1>SnapTestPro Backend</h1>
    <div class="mut sm">Dashboard · owner login</div>
    <label>Email</label><input id="lg-email" type="email" autocomplete="username" placeholder="owner@email.com">
    <label>Password</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="password">
    <label class="row" style="gap:8px;margin-top:12px"><input id="lg-keep" type="checkbox" style="width:auto"> <span>Is device par login yaad rakho</span></label>
    <div class="row" style="margin-top:14px">
      <button class="btn pri grow" id="lg-go">Login</button>
      <button class="btn" id="lg-su" title="Pehli baar: backend par account banao">Signup</button>
    </div>
    <div id="lg-err" class="err"></div>
    <div class="mut sm" style="margin-top:12px">Sirf wahi email admin banta hai jo Render me <span class="mono">ADMIN_EMAILS</span> me hai.</div>
  </div>
</div>

<div id="app" class="hide">
  <header><b>⚡ SnapTestPro</b><span class="mut sm" id="who"></span><span class="sp"></span><button class="btn sm" id="logout">Logout</button></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORIGIN=location.origin;
const BUILD='99999'; // MIN_BUILD wale backend par dashboard rok na jaye
let token=sessionStorage.getItem('stp_dash_token')||localStorage.getItem('stp_dash_token')||'';
let me='';
const cache={};
const TABS=[['overview','Overview'],['data','Data'],['users','Users'],['rules','Rules'],['projects','Projects'],['files','Files'],['audit','Audit'],['tools','Tools']];
let tab='overview';
const view={ coll:'',project:'main',q:'',offset:0 };

/* ---------- helpers ---------- */
function toast(msg,bad){const d=document.createElement('div');d.textContent=msg;if(bad)d.className='e';$('#toast').appendChild(d);setTimeout(()=>d.remove(),bad?5000:2600);}
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'X-App-Build':BUILD,...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){if(r.status===401&&token&&path.indexOf('/api/auth/')!==0){logout(true);}const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e;}
  return j;
}
const fmtB=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(1)+' KB':n+' B';
const fmtD=d=>d?new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const fmtUp=s=>s>86400?Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h':s>3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/60)+'m';
const pretty=o=>JSON.stringify(o,null,2);
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copy ho gaya');}catch(e){toast('Copy nahi hua, manually select karo',true);}}
function modal(html,mount){closeModal();const o=document.createElement('div');o.id='ov';o.innerHTML='<div class="box">'+html+'</div>';o.addEventListener('click',e=>{if(e.target===o)closeModal();});document.body.appendChild(o);if(mount)mount(o.firstChild);return o;}
function closeModal(){const o=$('#ov');if(o)o.remove();}
function bars(rows,key,cls){if(!rows||!rows.length)return '<div class="mut sm">Abhi koi usage nahi</div>';const mx=Math.max(1,...rows.map(r=>r[key]));return '<div class="bars '+(cls||'')+'">'+rows.map(r=>'<i title="'+esc(r.day)+': '+r[key]+'" style="height:'+Math.max(3,r[key]/mx*100)+'%"></i>').join('')+'</div>';}
async function guard(fn,btn){if(btn)btn.disabled=true;try{return await fn();}catch(e){toast(e.message,true);}finally{if(btn)btn.disabled=false;}}
async function download(path,name){const r=await fetch(path,{headers:{Authorization:'Bearer '+token,'X-App-Build':BUILD}});if(!r.ok){let j={};try{j=await r.json();}catch(e){}throw new Error(j.error||'Export fail');}
  const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
const PRESETS={
  private:{default:{read:'owner',write:'owner'},collections:{}},
  public_read:{default:{read:'owner',write:'owner'},collections:{news:{read:'public',write:'admin'}}},
  catalog:{default:{read:'auth',write:'admin'},collections:{results:{read:'owner',write:'owner'}}},
  open:{default:{read:'public',write:'public'},collections:{}}
};
const PRESET_HTML='<option value="private">Private: har user sirf apna data (owner/owner)</option><option value="catalog">Catalog: login wale padhein, sirf admin likhe, results private</option><option value="public_read">Public news padh sakte hain, baaki private</option><option value="open">Open: koi bhi padhe/likhe (sirf test ke liye)</option>';

/* ---------- auth ---------- */
function showLogin(msg){$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#lg-err').textContent=msg||'';}
function logout(expired){token='';sessionStorage.removeItem('stp_dash_token');localStorage.removeItem('stp_dash_token');showLogin(expired===true?'Session khatam, dobara login karo':'');}
async function doLogin(signup){
  const email=$('#lg-email').value.trim(),password=$('#lg-pass').value;
  if(!email||!password){$('#lg-err').textContent='Email aur password daalo';return;}
  const btn=signup?$('#lg-su'):$('#lg-go');btn.disabled=true;$('#lg-err').textContent='';
  try{
    const r=await api('POST',signup?'/api/auth/signup':'/api/auth/login',{email,password});
    token=r.token;(($('#lg-keep').checked)?localStorage:sessionStorage).setItem('stp_dash_token',token);
    await enter();
  }catch(e){$('#lg-err').textContent=e.message;token='';}
  finally{btn.disabled=false;}
}
async function enter(){
  try{const ov=await api('GET','/api/admin/overview');cache.overview=ov;}
  catch(e){
    if(e.status===403){token='';sessionStorage.removeItem('stp_dash_token');localStorage.removeItem('stp_dash_token');showLogin('Ye account admin nahi hai. Render ke ADMIN_EMAILS me ye email daalo, phir login/signup karo.');return;}
    throw e;
  }
  try{const p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));me=p.email||'';}catch(e){me='';}
  $('#who').textContent=me;$('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#nav').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'">'+t[1]+'</button>').join('');
  go('overview');
}

/* ---------- router ---------- */
async function go(t){
  tab=t;[...$('#nav').children].forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  const el=$('#main');el.innerHTML='<div class="mut">Load ho raha hai…</div>';
  try{await VIEWS[t](el);}catch(e){el.innerHTML='<div class="card"><b>Dikkat:</b> '+esc(e.message)+'</div>';}
}

/* ---------- OVERVIEW ---------- */
async function vOverview(el){
  const r=await api('GET','/api/admin/overview');cache.overview=r;const o=r.overview;
  const st=(v,l)=>'<div class="stat"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>';
  el.innerHTML='<div class="grid">'+st(o.users,'Users (main)')+st(o.documents,'Documents (main)')+st(o.projects,'Projects')+st(o.projectUsers,'Project users')+st(o.projectDocuments,'Project documents')
   +st(o.dbSizeMB+' MB','Database size')+st(o.files+' · '+o.filesMB+' MB','Files')+st(o.dbLatencyMs+' ms','DB speed')+st(fmtUp(o.uptimeSec),'Server uptime')+st(o.memoryMB+' MB','Memory')+'</div>'
   +'<div class="card" style="margin-top:12px"><h2>Pichhle 7 din — requests (main)</h2>'+bars(r.usage,'requests')+'<div class="mut sm" style="margin-top:6px">Writes</div>'+bars(r.usage,'writes','w')+'</div>'
   +'<h3>Collections (main)</h3><div class="tblwrap"><table><tr><th>Naam</th><th>Docs</th><th>Size</th><th>Last change</th><th></th></tr>'
   +(r.collections.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+c.count+'</td><td>'+fmtB(c.bytes)+'</td><td>'+fmtD(c.last)+'</td><td><button class="btn sm" data-act="open-coll" data-c="'+esc(c.name)+'">Kholo</button> <button class="btn sm" data-act="export" data-c="'+esc(c.name)+'">Export</button></td></tr>').join('')||'<tr><td colspan="5" class="mut">Abhi koi data nahi</td></tr>')+'</table></div>'
   +'<div class="row" style="margin-top:12px"><button class="btn pri" data-act="export-all">⬇ Poora backup (JSON)</button><span class="mut sm">Rules: '+esc(o.rulesSource)+' · Firebase bridge: '+(o.firebaseBridge?'ON':'OFF')+' · MIN_BUILD: '+(o.minBuild||'off')+' · Node '+esc(o.node)+'</span></div>';
}

/* ---------- DATA ---------- */
async function projectsList(force){if(!cache.projects||force){cache.projects=(await api('GET','/api/admin/projects')).projects;}return cache.projects;}
async function collectionsFor(project){
  if(project==='main'){const r=await api('GET','/api/admin/overview');cache.overview=r;return r.collections.map(c=>c.name);}
  const r=await api('GET','/api/admin/projects/'+encodeURIComponent(project));return r.collections.map(c=>c.name);
}
async function vData(el){
  const projects=await projectsList();
  const names=await collectionsFor(view.project);
  if(!view.coll&&names.length)view.coll=names[0];
  el.innerHTML='<div class="card"><div class="row"><div class="grow"><label style="margin-top:0">Kiska data</label><select id="d-proj"><option value="main">Main (asli app)</option>'+projects.map(p=>'<option value="'+esc(p.id)+'">Project: '+esc(p.name)+'</option>').join('')+'</select></div>'
   +'<div class="grow"><label style="margin-top:0">Collection</label><input id="d-coll" list="d-list" value="'+esc(view.coll)+'" placeholder="collection naam"><datalist id="d-list">'+names.map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist></div></div>'
   +'<div style="margin-top:6px">'+names.map(n=>'<button class="chip" data-act="pick-coll" data-c="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>'
   +'<div class="row" style="margin-top:10px"><input class="grow" id="d-q" placeholder="Search (id ya data me)" value="'+esc(view.q)+'"><button class="btn pri" id="d-go">Dhundo</button></div>'
   +'<div class="row" style="margin-top:10px"><button class="btn sm" data-act="new-doc">＋ Naya document</button><button class="btn sm" data-act="export-cur">⬇ Export</button><button class="btn sm" data-act="import-file">⬆ Import JSON</button><button class="btn sm bad" data-act="del-coll">Collection delete</button><input type="file" id="d-file" accept=".json,application/json" class="hide"></div></div>'
   +'<div id="d-res" style="margin-top:12px"></div>';
  $('#d-proj').value=view.project;
  await loadDocs();
}
async function loadDocs(){
  const box=$('#d-res');if(!box)return;
  if(!view.coll){box.innerHTML='<div class="mut">Collection chuno ya naam likho.</div>';return;}
  box.innerHTML='<div class="mut">Load ho raha hai…</div>';
  const lim=30;
  try{
    const r=await api('GET','/api/admin/documents?collection='+encodeURIComponent(view.coll)+(view.project!=='main'?'&project='+view.project:'')+'&q='+encodeURIComponent(view.q)+'&limit='+lim+'&offset='+view.offset);
    cache.docs=r.docs;if(r.total!=null)cache.total=r.total;
    box.innerHTML='<div class="mut sm" style="margin-bottom:6px">'+(cache.total||0)+' documents · dikh rahe: '+(r.docs.length?view.offset+1:0)+'–'+(view.offset+r.docs.length)+'</div>'
     +'<div class="tblwrap"><table><tr><th>ID</th><th>Data</th><th>Badla</th></tr>'+(r.docs.map((d,i)=>'<tr class="click" data-act="edit-doc" data-i="'+i+'"><td class="mono">'+esc(d.id)+'</td><td class="pv">'+esc(JSON.stringify(d.data).slice(0,160))+'</td><td class="sm mut">'+fmtD(d.updatedAt)+'</td></tr>').join('')||'<tr><td colspan="3" class="mut">Koi document nahi mila</td></tr>')+'</table></div>'
     +'<div class="row" style="margin-top:10px"><button class="btn sm" data-act="prev" '+(view.offset?'':'disabled')+'>← Pichhla</button><button class="btn sm" data-act="next" '+(r.docs.length<lim?'disabled':'')+'>Agla →</button></div>';
  }catch(e){box.innerHTML='<div class="err">'+esc(e.message)+'</div>';}
}
function docModal(d,isNew){
  modal('<h2>'+(isNew?'Naya document':'Document')+'</h2>'+(isNew?'<label>Document ID</label><input id="m-id" placeholder="jaise q1">':'<div class="mono">'+esc(d.id)+'</div><div class="mut sm">Owner: '+esc(d.ownerUid||'-')+' · Bana: '+fmtD(d.createdAt)+'</div>')
    +'<label>Data (JSON)</label><textarea id="m-json" spellcheck="false">'+esc(pretty(isNew?{}:d.data))+'</textarea>'
    +'<div class="row" style="margin-top:12px"><button class="btn pri" id="m-save">Save</button>'+(isNew?'':'<button class="btn bad" id="m-del">Delete</button>')+'<button class="btn" id="m-x">Band karo</button></div>',m=>{
    $('#m-x',m).onclick=closeModal;
    $('#m-save',m).onclick=e=>guard(async()=>{
      let data;try{data=JSON.parse($('#m-json',m).value);}catch(x){throw new Error('JSON galat hai: '+x.message);}
      const id=isNew?$('#m-id',m).value.trim():d.id;if(!id)throw new Error('ID chahiye');
      await api('PUT','/api/admin/documents/'+encodeURIComponent(view.coll)+'/'+encodeURIComponent(id)+(view.project!=='main'?'?project='+view.project:''),{data});
      toast('Save ho gaya');closeModal();cache.total=null;loadDocs();
    },e.target);
    if(!isNew)$('#m-del',m).onclick=e=>{if(!confirm('Ye document delete karna hai?'))return;guard(async()=>{
      await api('DELETE','/api/admin/documents/'+encodeURIComponent(view.coll)+'/'+encodeURIComponent(d.id)+(view.project!=='main'?'?project='+view.project:''));
      toast('Delete ho gaya');closeModal();cache.total=null;loadDocs();},e.target);};
  });
}
async function importFile(file){
  const txt=await file.text();let j;try{j=JSON.parse(txt);}catch(e){throw new Error('File valid JSON nahi hai');}
  let cols;
  if(j&&j.collections&&typeof j.collections==='object')cols=j.collections;
  else if(Array.isArray(j)){if(!view.coll)throw new Error('Pehle collection chuno');cols={[view.coll]:j};}
  else throw new Error('Format samajh nahi aaya (backup JSON ya docs ki list chahiye)');
  const names=Object.keys(cols);const total=names.reduce((a,n)=>a+cols[n].length,0);
  if(!confirm(names.length+' collections, '+total+' documents import honge (same ID wale overwrite). Aage badhein?'))return;
  let done=0;const q=view.project!=='main'?'?project='+view.project:'';
  for(const n of names){
    let chunk=[],size=0;
    const flush=async()=>{if(!chunk.length)return;await api('POST','/api/admin/import'+q,{collection:n,docs:chunk});done+=chunk.length;toast('Import: '+done+'/'+total);chunk=[];size=0;};
    for(const d of cols[n]){const s=JSON.stringify(d).length;if(chunk.length>=300||size+s>900000)await flush();chunk.push({id:d.id,data:d.data,ownerUid:d.ownerUid,createdAt:d.createdAt});size+=s;}
    await flush();
  }
  toast('Import poora: '+done+' documents');cache.total=null;await go('data');
}

/* ---------- USERS ---------- */
async function vUsers(el,q,off){
  q=q||'';off=off||0;const r=await api('GET','/api/admin/users?limit=50&offset='+off+'&q='+encodeURIComponent(q));cache.users=r.users;
  el.innerHTML='<div class="row"><input class="grow" id="u-q" placeholder="Email ya naam" value="'+esc(q)+'"><button class="btn pri" id="u-go">Dhundo</button></div><div class="mut sm" style="margin:8px 0">'+r.total+' users (main backend ke). Project ke users Projects tab me.</div>'

   +'<div class="card" style="margin-top:12px"><h2>Quick links</h2><div class="row"><button class="btn" data-copy="'+esc(ORIGIN)+'">Backend URL copy</button><button class="btn" data-copy="'+esc(ORIGIN+'/sdk/snaptestpro-sdk.js')+'">SDK link copy</button><a class="btn" href="/api/health" target="_blank" rel="noopener">Health</a></div></div>';

const VIEWS={overview:vOverview,data:vData,users:vUsers,rules:vRules,projects:vProjects,files:vFiles,audit:vAudit,tools:vTools};

/* ---------- global click delegation ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');if(c){copy(c.dataset.copy);return;}
  const nb=e.target.closest('#nav button');if(nb){go(nb.dataset.tab);return;}
  if(e.target.id==='d-go'){view.q=$('#d-q').value.trim();view.offset=0;cache.total=null;loadDocs();return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=+a.dataset.i;
  if(act==='open-coll'){view.project='main';view.coll=a.dataset.c;view.q='';view.offset=0;cache.total=null;go('data');}
  else if(act==='export'){guard(()=>download('/api/admin/export?collection='+encodeURIComponent(a.dataset.c),a.dataset.c+'.json'),a);}
  else if(act==='export-all'){guard(()=>download('/api/admin/export','snaptestpro-backup.json'),a);}
  else if(act==='export-cur'){guard(()=>download('/api/admin/export?collection='+encodeURIComponent(view.coll)+(view.project!=='main'?'&project='+view.project:''),view.coll+'.json'),a);}
  else if(act==='pick-coll'){view.coll=a.dataset.c;view.offset=0;cache.total=null;$('#d-coll').value=view.coll;loadDocs();}
  else if(act==='edit-doc'){docModal(cache.docs[i],false);}
  else if(act==='new-doc'){if(!view.coll){toast('Pehle collection ka naam likho',true);return;}docModal(null,true);}
  else if(act==='prev'){view.offset=Math.max(0,view.offset-30);loadDocs();}
  else if(act==='next'){view.offset+=30;loadDocs();}
  else if(act==='import-file'){$('#d-file').click();}
  else if(act==='del-coll'){if(!view.coll)return;const c=prompt('"'+view.coll+'" ke SAARE documents delete honge. Confirm ke liye collection ka naam likho:');if(c!==view.coll)return;
    guard(async()=>{const r=await api('DELETE','/api/admin/collections/'+encodeURIComponent(view.coll)+'?confirm='+encodeURIComponent(c)+(view.project!=='main'?'&project='+view.project:''));toast(r.deleted+' documents delete');view.coll='';cache.total=null;go('data');},a);}
  else if(act==='u-role'){const u=cache.users[i];guard(async()=>{await api('PATCH','/api/admin/users/'+u.uid,{role:u.role==='admin'?'user':'admin'});toast('Role badal gaya');go('users');},a);}
  else if(act==='u-pass'){const u=cache.users[i];const np=prompt(u.email+' ka naya password (khali chhodo to khud ban jayega):','');if(np===null)return;
    guard(async()=>{const r=await api('POST','/api/admin/users/'+u.uid+'/password',np?{newPassword:np}:{});modal('<h2>Password badal gaya</h2><div class="mono">'+esc(u.email)+'</div>'+(r.newPassword?'<label>Naya password</label><div class="row"><input class="grow mono" readonly value="'+esc(r.newPassword)+'"><button class="btn sm" data-copy="'+esc(r.newPassword)+'">Copy</button></div>':'')+'<div class="row" style="margin-top:12px"><button class="btn pri" id="pw-x">Ho gaya</button></div>',m=>{$('#pw-x',m).onclick=closeModal;});},a);}
  else if(act==='u-del'){const u=cache.users[i];if(!confirm(u.email+' ko delete karna hai?'))return;guard(async()=>{await api('DELETE','/api/admin/users/'+u.uid);toast('Delete ho gaya');go('users');},a);}
  else if(act==='p-new'){newProjectModal();}
  else if(act==='p-open'){guard(()=>projectModal(a.dataset.id),a);}
  else if(act==='p-data'){view.project=a.dataset.id;view.coll=a.dataset.c;view.q='';view.offset=0;cache.total=null;closeModal();go('data');}
  else if(act==='pu-role'){const u=cache.pusers[i];guard(async()=>{await api('PATCH','/api/admin/projects/'+a.dataset.id+'/users/'+u.uid,{role:u.role==='admin'?'user':'admin'});toast('Role badal gaya');projectModal(a.dataset.id);},a);}
  else if(act==='pu-del'){const u=cache.pusers[i];if(!confirm(u.email+' ko is project se hatana hai?'))return;guard(async()=>{await api('DELETE','/api/admin/projects/'+a.dataset.id+'/users/'+u.uid);toast('Hata diya');projectModal(a.dataset.id);},a);}
  else if(act==='f-del'){const f=cache.files[i];if(!confirm(f.name+' delete karni hai?'))return;guard(async()=>{await api('DELETE','/api/storage/files/'+f.id);toast('Delete ho gayi');go('files');},a);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='d-proj'){view.project=e.target.value;view.coll='';view.q='';view.offset=0;cache.total=null;go('data');}
  if(e.target.id==='d-coll'){view.coll=e.target.value.trim();view.offset=0;cache.total=null;loadDocs();}
  if(e.target.id==='d-file'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';guard(()=>importFile(f));}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='d-q'){view.q=e.target.value.trim();view.offset=0;cache.total=null;loadDocs();}
  if(e.key==='Enter'&&(e.target.id==='lg-pass'||e.target.id==='lg-email'))doLogin(false);
  if(e.key==='Escape')closeModal();
});
$('#lg-go').onclick=()=>doLogin(false);$('#lg-su').onclick=()=>doLogin(true);$('#logout').onclick=()=>logout();

if(token)enter().catch(e=>showLogin(e.message));else showLogin('');
})();
