services:
  - type: web
    name: snaptestpro-backend
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: OWNER_EMAILS
        sync: false
      - key: EXTRA_ADMIN_EMAILS
        sync: false
